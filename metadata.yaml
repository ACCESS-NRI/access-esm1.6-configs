description: |-
  ACCESS-ESM1.6 global coupled model configuration running with an interactive carbon cycle under under scenario esm-scen7-h forcings. Scenario forcing data including anthropogenic co2 emissions are primarily sourced from the input4MIPs CMIP7 datasets.

# A tutorial for running ACCESS ESM1.5 can be found at
# https://access-hive.org.au/models/run-a-model/run-access-esm
# Full details about the payu configuration settings are available at
# https://payu.readthedocs.io/en/latest/config.html


# PBS configuration

# If submitting to a different project to your default, uncomment line below
# and replace PROJECT_CODE with appropriate code. This may require setting shortpath
# project: PROJECT_CODE

# Force payu to always find, and save, files in this scratch project directory
# shortpath: /scratch/PROJECT_CODE

# Note: if laboratory is relative path, it is relative to shortpath/$USER
laboratory: access-esm

jobname: piClim-control
queue: normalsr
walltime: 2:30:00
jobfs: 15GB

platform:
  nodesize: 104
  nodemem: 512

storage:
  gdata:
    - tm70

# Modules for loading model executables
modules:
  use:
      - /g/data/vk83/modules
  load:
      - access-esm1p6/2026.04.002

# Model configuration
model: access-esm1.6

submodels:
    - name: atmosphere
      model: um
      ncpus: 208
      exe: um_hg3.exe
      input:
        # Aerosols
        - /g/data/vk83/configurations/inputs/access-esm1p6/modern/pre-industrial/atmosphere/aerosol/global.N96/2025.06.04/OCFF_1850_cmip7.anc
        - /g/data/vk83/configurations/inputs/access-esm1p6/modern/pre-industrial/atmosphere/aerosol/global.N96/2025.06.04/BC_1850_cmip7.anc
        - /g/data/vk83/configurations/inputs/access-esm1p6/modern/pre-industrial/atmosphere/aerosol/global.N96/2025.06.04/scycl_1850_cmip7.anc
        - /g/data/vk83/configurations/inputs/access-esm1p6/modern/pre-industrial/atmosphere/aerosol/global.N96/2025.06.04/Bio_1850_cmip7.anc
        - /g/data/vk83/configurations/inputs/access-esm1p5/modern/share/atmosphere/aerosol/global.N96/2020.05.19/biogenic_351sm.N96L38
        - /g/data/vk83/configurations/inputs/access-esm1p5/modern/share/atmosphere/aerosol/global.N96/2020.05.19/sulpc_oxidants_N96_L38
        - /g/data/vk83/configurations/inputs/access-esm1p5/modern/share/atmosphere/aerosol/global.N96/2020.05.19/DMS_conc.N96
        # Forcing
        - /g/data/vk83/configurations/inputs/access-esm1p6/modern/pre-industrial/atmosphere/forcing/global.N96/2025.12.09/ozone_1850_cmip7.anc
        # Land
        - /g/data/vk83/configurations/inputs/access-esm1p6/modern/pre-industrial/atmosphere/land/biogeochemistry/global.N96/2026.03.27/Ndep_1850_cmip7_v2_0.anc
        - /g/data/vk83/configurations/inputs/access-esm1p6/share/atmosphere/land/vegetation/global.N96/2025.08.29/cable_vegfunc_N96.anc
        - /g/data/vk83/configurations/inputs/access-esm1p6/share/atmosphere/land/biogeochemistry/resolution_independent/2025.08.29/modis_phenology_csiro_13evergreen.txt
        - /g/data/vk83/configurations/inputs/access-esm1p6/share/atmosphere/land/biogeochemistry/resolution_independent/2026.02.10/pftlookup_cable3_Pfix.csv
        # Spectral
        - /g/data/vk83/configurations/inputs/access-esm1p5/share/atmosphere/spectral/resolution_independent/2020.05.19/spec3a_sw_hadgem1_6on
        - /g/data/vk83/configurations/inputs/access-esm1p5/share/atmosphere/spectral/resolution_independent/2020.05.19/spec3a_lw_hadgem1_6on
        # STASH
        - /g/data/vk83/prerelease/configurations/inputs/access-esm1p6/share/atmosphere/stash/2026.01.21/
        # Boundary conditions
        - /g/data/tm70/mrd599/CMIP7/esm1p6_ancil_test/2026.08.03/modern/amip/atmosphere/boundary_conditions/global.N96/2026.08.03/seaice_piclim_n96_gregorian.anc
        - /g/data/tm70/mrd599/CMIP7/esm1p6_ancil_test/2026.08.03/modern/amip/atmosphere/boundary_conditions/global.N96/2026.08.03/sst_piclim_n96_gregorian.anc


restart: /scratch/tm70/mrd599/restart_piclim

# Timing controls
calendar:
    runtime:
        years: 1
        months: 0
        days: 0

runspersub: 1

# Misc
restart_freq: 10YS

runlog: true
manifest:
  reproduce:
    exe: false
    input: false

stacksize: unlimited
qsub_flags: -W umask=027
mpi:
  flags:
    - --mca mpi_yield_when_idle true
payu_minimum_version: 1.3.0

# Sync options for automatically copying data from ephemeral scratch space to
# longer term storage
sync:
    enable: False # set path below and change to true
    restarts: True
    base_path: null # Set to location on /g/data (e.g., /g/data/$PROJECT/$USER/)

# If a postscript included (such as the automated netcdf conversion), the latest output and restart files will not
# be automatically synced at the end of a run. To sync the latest output after a postscript has completed,
#  manually run `payu sync` from the command line.

# userscripts:

postscript: -v PAYU_CURRENT_OUTPUT_DIR,PROJECT  -lstorage=${PBS_NCI_STORAGE} ./scripts/NetCDF-conversion/UM_conversion_job.sh
